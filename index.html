<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <meta name="description" content="HODIE — a local-first English learning environment. Today. Not tomorrow.">
  <meta name="google" content="notranslate">
  <script>
    (() => {
      const saved = localStorage.getItem("hodie-theme-v1");
      const theme = saved === "dark" || saved === "light"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-light-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/icon-light-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-light-180.png">
  <title>HODIE — Today. Not tomorrow.</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .ai-lab-entry { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin:1.25rem 0 1.5rem; padding:1.1rem 1.25rem; border:1px solid var(--border,#cfd7e2); border-left:4px solid #e0a63d; border-radius:1rem; background:var(--surface,#fff); }
    .ai-lab-entry h2 { margin:.15rem 0 .35rem; font-size:1.15rem; }
    .ai-lab-entry p { margin:.2rem 0; }
    .ai-lab-eyebrow { font-size:.75rem; font-weight:700; letter-spacing:.08em; color:var(--muted,#526071); }
    .ai-lab-button { flex-shrink:0; display:inline-block; padding:.8rem 1rem; border-radius:.7rem; background:#172033; color:#fff; font-weight:700; text-decoration:none; }
    @media(max-width:600px) { .ai-lab-entry { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body translate="no" class="notranslate">
  <main class="app-shell">
    <header class="brand">
      <a class="brand-mark" href="./" aria-label="HODIE — Today. Not tomorrow.">
        <img class="theme-logo theme-logo-light" src="./assets/brand/hodie-logo.png" alt="HODIE — Today. Not tomorrow." width="760" height="260">
        <img class="theme-logo theme-logo-dark" src="./assets/brand/hodie-logo-dark.png" alt="" aria-hidden="true" width="760" height="260">
      </a>
      <div class="brand-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">☾</button>
        <span class="badge" id="levelBadge">A2</span>
      </div>
    </header>

    <section class="ai-lab-entry" aria-labelledby="ai-lab-title">
      <div>
        <p class="ai-lab-eyebrow">EXPERIMENTAL · AI TOOLS</p>
        <h2 id="ai-lab-title">Experiment with voice AI</h2>
        <p>Try speech recognition with Scribe and English voice generation with Voice.</p>
      </div>
      <a class="ai-lab-button" href="./runonweb-lab.html">Open AI Lab →</a>
    </section>

    <section id="app" aria-live="polite">
      <div class="loading">Preparing today's practice...</div>
    </section>

    <div id="installPrompt" class="install-prompt" hidden></div>

    <footer>
      <span>Practice · conversation · progress · local-first</span>
      <a href="./runonweb-lab.html">RunOnWeb Lab · Experimental</a>
      <button id="resetButton" class="text-button" type="button">Reset progress</button>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
